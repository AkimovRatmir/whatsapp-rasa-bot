version: "3.1"

nlu:
- intent: greet
  examples: |
    - Привет
    - Здравствуй
    - Добрый день
    - Хай
    - Здрасте

- intent: goodbye
  examples: |
    - Пока
    - До свидания
    - Увидимся
    - Прощай

- intent: section_1_problem
  examples: |
    - У меня проблема с первым разделом
    - Проблема в первом пункте
    - Раздел 1 вызывает сложности
    - Я не понимаю первый шаг
    - У меня вопрос по 1

- intent: section_2_problem
  examples: |
    - Не понимаю, как заполнить второй раздел
    - У меня вопрос по пункту 2
    - Раздел 2 вызывает вопросы
    - Мне нужна помощь со вторым этапом

- intent: section_3_problem
  examples: |
    - Проблема с третьим шагом
    - Как пройти пункт 3?
    - У меня трудности с разделом 3
    - Помогите с 3 шагом

- intent: section_4_problem
  examples: |
    - Я не понимаю четвертый шаг
    - Раздел 4 вызывает сложности
    - Пункт 4 не ясен
    - Подскажите по 4 разделу

- intent: section_5_problem
  examples: |
    - У меня вопрос по последнему этапу
    - Помощь по пятому пункту
    - Что делать в разделе 5?
    - Не могу понять шаг 5

